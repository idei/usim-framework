grid:
  cols: [1fr, 1fr]
  gap: 14
  padding: l
  default_span: 2

  children:
    - lbl_instruction: { justify: center, style: info, center: true }
    - input_name:      { type: text,  required: true, width: full }
    - input_email:     { type: email, required: true, width: full }
    - input_message:   { row: 1fr,    required: true, width: full }
    - btn_submit:      { span: 1, justify: start, style: primary,   action: submit_form, width: full }
    - btn_reset:       { span: 1, justify: end,   style: secondary, action: reset_form,  width: full }
    - lbl_result:      { justify: center, style: secondary, width: full }
