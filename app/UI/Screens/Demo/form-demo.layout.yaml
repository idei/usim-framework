grid:
  cols: [1fr, 1fr]
  gap: 14
  padding: 24
  default_span: 2

  children:
    - { slot: lbl_instruction, justify: center }          # Fila 1 (automática, span 2)
    - { slot: input_name }                                # Fila 2 (automática, span 2)
    - { slot: input_email }                               # Fila 3 (automática, span 2)
    - { slot: input_message,   row: 1fr }                 # Fila 4 (automática, span 2, absorbe alto)
    - { slot: btn_submit,      span: 1, justify: start }  # Fila 5, Col 1 (automática)
    - { slot: btn_reset,       span: 1, justify: end }    # Fila 5, Col 2 (entra al lado porque sobra 1 col)
    - { slot: lbl_result,      justify: center }          # Fila 6 (automática, span 2)
