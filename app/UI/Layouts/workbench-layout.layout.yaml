name: workbench_layout
appearance: plain
custom_class: usim-workbench-root
width: 100%
height: 100vh
padding: none

grid:
  cols: [52px, 1fr]
  rows: [1fr, auto]
  gap: none
  padding: none

  children:
    - sidebar_container:
        at: [1, 1]
        layout_slot: sidebar
        slot_aliases: [activity_bar, menu]
        appearance: plain
        width: 52px
        height: 100%

    - split_shell:
        at: [1, 2]
        component: split
        orientation: horizontal
        split_size: 250px
        splitter_size: 6px
        min_first_size: 180px
        min_second_size: 320px
        draggable: true
        collapsible: true
        collapse_target: first
        collapse_size: 0px
        collapsed_panel: first
        hide_divider_when_collapsed: true
        appearance: plain
        width: 100%
        height: 100%
        first:
          name: left_panel_container
          layout_slot: left_panel
          slot_aliases: [left, explorer]
          persist_on_navigate: false
          appearance: subtle
        second:
          name: split_workspace
          component: split
          orientation: horizontal
          split_size: 72%
          splitter_size: 6px
          min_first_size: 320px
          min_second_size: 260px
          draggable: true
          collapsible: true
          collapse_target: second
          collapse_size: 0px
          collapsed_panel: second
          hide_divider_when_collapsed: true
          appearance: plain
          width: 100%
          height: 100%
          first:
            name: center_column_container
            custom_class: usim-workbench-center
            appearance: plain
            width: 100%
            height: 100%
            grid:
              cols: [1fr]
              rows: [auto, 1fr]
              gap: none
              padding: none
              children:
                - top_bar_container:
                    at: [1, 1]
                    layout_slot: top_bar
                    slot_aliases: [header, toolbar]
                    persist_on_navigate: false
                    appearance: plain
                    width: 100%
                    visible: false
                - split_center:
                    at: [2, 1]
                    component: split
                    orientation: vertical
                    split_size: 240px
                    split_size_target: second
                    splitter_size: 6px
                    min_first_size: 200px
                    min_second_size: 120px
                    draggable: true
                    collapsible: true
                    collapse_target: second
                    collapse_size: 0px
                    collapsed_panel: second
                    hide_divider_when_collapsed: true
                    appearance: plain
                    width: 100%
                    height: 100%
                    first:
                      name: content_container
                      layout_slot: main
                      slot_aliases: [content]
                      appearance: plain
                    second:
                      name: bottom_panel_container
                      layout_slot: bottom_panel
                      slot_aliases: [bottom, panel, console, terminal]
                      persist_on_navigate: false
                      appearance: subtle
          second:
            name: right_panel_container
            layout_slot: right_panel
            slot_aliases: [right, inspector]
            persist_on_navigate: false
            appearance: subtle

    - status_bar_container:
        at: [2, 1]
        span: full
        layout_slot: status_bar
        appearance: plain
        width: 100%
