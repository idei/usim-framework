name: workbench_layout
appearance: plain
custom_class: usim-workbench-root
width: 100%
height: 100vh
padding: none

grid:
  cols: [1fr]
  rows: [1fr, auto]
  gap: none
  padding: none

  children:
    - split_shell:
        at: [1, 1]
        component: split
        orientation: horizontal
        split_size: 260px
        splitter_size: 6px
        min_first_size: 180px
        min_second_size: 320px
        draggable: true
        collapsible: true
        collapse_target: first
        collapse_size: 52px
        appearance: plain
        width: 100%
        height: 100%
        first:
          name: sidebar_container
          layout_slot: sidebar
          slot_aliases: [menu]
          appearance: plain
        second:
          name: split_workspace
          component: split
          orientation: horizontal
          split_size: 72%
          splitter_size: 6px
          min_first_size: 320px
          min_second_size: 260px
          draggable: true
          collapsible: true
          collapse_target: second
          collapse_size: 0px
          collapsed_panel: second
          hide_divider_when_collapsed: true
          appearance: plain
          width: 100%
          height: 100%
          first:
            name: content_container
            layout_slot: main
            slot_aliases: [content]
            appearance: plain
          second:
            name: right_panel_container
            layout_slot: right_panel
            slot_aliases: [right, inspector]
            persist_on_navigate: false
            appearance: subtle

    - status_bar_container:
        at: [2, 1]
        layout_slot: status_bar
        appearance: plain
        width: 100%
